<div *ngIf="payroll.settings() as s" class="space-y-5">
  <div><h1 class="font-display text-xl font-semibold text-ink-100">الإعدادات</h1></div>
  <div class="bg-base-900 border border-base-700 rounded-lg p-5">
    <h3 class="font-display text-sm font-semibold text-ink-100 mb-4">إعدادات عامة</h3>
    <div class="grid grid-cols-2 gap-4 max-w-xl">
      <label class="flex flex-col gap-1.5"><span class="text-xs text-ink-500">معامل التحويل EGP</span><input [disabled]="!auth.canWriteFinance()" type="number" [value]="s.egpConversionRate" (blur)="updateGeneral('egpConversionRate', $any($event.target).value)" class="bg-base-850 border border-base-700 rounded-md px-3 py-2 text-sm text-ink-100 focus-ring" /></label>
      <label class="flex flex-col gap-1.5"><span class="text-xs text-ink-500">الراتب الأساسي للإدارة و IT</span><input [disabled]="!auth.canWriteFinance()" type="number" [value]="s.managementItBaseSalary" (blur)="updateGeneral('managementItBaseSalary', $any($event.target).value)" class="bg-base-850 border border-base-700 rounded-md px-3 py-2 text-sm text-ink-100 focus-ring" /></label>
    </div>
  </div>
  <div class="bg-base-900 border border-base-700 rounded-lg p-5">
    <h3 class="font-display text-sm font-semibold text-ink-100 mb-4">قواعد أداء الستريمرز</h3>
    <div class="grid grid-cols-2 gap-6">
      <div><div class="text-xs text-gold-400 mb-3">Standard</div><div class="grid grid-cols-2 gap-3"><label class="flex flex-col gap-1.5"><span class="text-xs text-ink-500">Minimum Score</span><input [disabled]="!auth.canWriteFinance()" type="number" [value]="s.streamerRules.standard.score" (blur)="updateStandard('score', $any($event.target).value)" class="bg-base-850 border border-base-700 rounded-md px-3 py-2 text-sm text-ink-100" /></label><label class="flex flex-col gap-1.5"><span class="text-xs text-ink-500">Minimum Days</span><input [disabled]="!auth.canWriteFinance()" type="number" [value]="s.streamerRules.standard.days" (blur)="updateStandard('days', $any($event.target).value)" class="bg-base-850 border border-base-700 rounded-md px-3 py-2 text-sm text-ink-100" /></label><label class="flex flex-col gap-1.5"><span class="text-xs text-ink-500">Minimum Hours</span><input [disabled]="!auth.canWriteFinance()" type="number" [value]="s.streamerRules.standard.hours" (blur)="updateStandard('hours', $any($event.target).value)" class="bg-base-850 border border-base-700 rounded-md px-3 py-2 text-sm text-ink-100" /></label><label class="flex flex-col gap-1.5"><span class="text-xs text-ink-500">Percent</span><input [disabled]="!auth.canWriteFinance()" type="number" step="0.01" [value]="s.streamerRules.standard.pct" (blur)="updateStandard('pct', $any($event.target).value)" class="bg-base-850 border border-base-700 rounded-md px-3 py-2 text-sm text-ink-100" /></label></div></div>
      <div><div class="text-xs text-gold-400 mb-3">Extra</div><div class="grid grid-cols-2 gap-3"><label class="flex flex-col gap-1.5"><span class="text-xs text-ink-500">Minimum Score</span><input [disabled]="!auth.canWriteFinance()" type="number" [value]="s.streamerRules.extra.score" (blur)="updateExtra('score', $any($event.target).value)" class="bg-base-850 border border-base-700 rounded-md px-3 py-2 text-sm text-ink-100" /></label><label class="flex flex-col gap-1.5"><span class="text-xs text-ink-500">Minimum Days</span><input [disabled]="!auth.canWriteFinance()" type="number" [value]="s.streamerRules.extra.days" (blur)="updateExtra('days', $any($event.target).value)" class="bg-base-850 border border-base-700 rounded-md px-3 py-2 text-sm text-ink-100" /></label><label class="flex flex-col gap-1.5"><span class="text-xs text-ink-500">Minimum Hours</span><input [disabled]="!auth.canWriteFinance()" type="number" [value]="s.streamerRules.extra.hours" (blur)="updateExtra('hours', $any($event.target).value)" class="bg-base-850 border border-base-700 rounded-md px-3 py-2 text-sm text-ink-100" /></label><label class="flex flex-col gap-1.5"><span class="text-xs text-ink-500">Percent</span><input [disabled]="!auth.canWriteFinance()" type="number" step="0.01" [value]="s.streamerRules.extra.pct" (blur)="updateExtra('pct', $any($event.target).value)" class="bg-base-850 border border-base-700 rounded-md px-3 py-2 text-sm text-ink-100" /></label></div></div>
    </div>
    <label class="flex flex-col gap-1.5 w-48 mt-4"><span class="text-xs text-ink-500">Default streamer rate</span><input [disabled]="!auth.canWriteFinance()" type="number" step="0.01" [value]="s.streamerRules.defaultRate" (blur)="updateDefaultRate($any($event.target).value)" class="bg-base-850 border border-base-700 rounded-md px-3 py-2 text-sm text-ink-100" /></label>
  </div>
</div>
